<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swift Courier Admin Panel</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Swift Courier Admin Panel</h1>

        <div id="loginForm">
            <h2>Login</h2>
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">
            <button onclick="login()">Login</button>
        </div>

        <div id="mainContent" style="display: none;">
            <nav>
                <button onclick="showOrderList()">Orders</button>
                <button onclick="showChatSection()">Chat</button>
            </nav>

            <div id="orderList">
                <h2>Order List</h2>
                <div id="orderListContent"></div>
            </div>

            <div id="chatSection" style="display: none;">
	    <h2>Chat</h2>
	    <select id="userSelect" onchange="changeUser()">
		<option value="">Select a user</option>
	    </select>
	    <div id="chatMessages"></div>
	    <div id="chatInput">
		<input type="text" id="messageInput" placeholder="Type your message...">
		<button onclick="sendMessage()">Send</button>
	    </div>
</div>
</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
